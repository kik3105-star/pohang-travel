:root{
  --ink:#17243d;
  --blue:#1565c0;
  --sky:#eaf5ff;
  --line:#dbe7f2;
  --muted:#667085;
  --max:920px;
}

*{box-sizing:border-box}

html{scroll-behavior:smooth}

body{
  margin:0;
  font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;
  color:var(--ink);
  background:#fff;
  line-height:1.7;
}

a{color:inherit}

.wrap{
  max-width:var(--max);
  margin:auto;
  padding:0 20px;
}

.top{
  position:sticky;
  top:0;
  z-index:5;
  background:rgba(255,255,255,.94);
  border-bottom:1px solid var(--line);
  backdrop-filter:blur(8px);
}

.nav{
  height:64px;
  display:flex;
  align-items:center;
}

.brand{
  display:flex;
  align-items:center;
  font-weight:950;
  font-size:22px;
  text-decoration:none;
  letter-spacing:-1px;
}

.brandmark{
  display:inline-grid;
  place-items:center;
  width:42px;
  height:42px;
  margin-right:10px;
  border-radius:12px;
  background:var(--ink);
  color:#fff;
  font-size:13px;
  font-weight:900;
}

.hero{
  padding:34px 0 16px;
}

.eyebrow{
  color:var(--blue);
  font-weight:800;
}

.hero h1{
  font-size:clamp(30px,7vw,52px);
  line-height:1.18;
  margin:8px 0 14px;
  letter-spacing:-1.8px;
}

.lead{
  font-size:18px;
  color:#475467;
}

.heroimg{
  width:100%;
  aspect-ratio:16/9;
  object-fit:cover;
  border-radius:22px;
  margin:18px 0;
  box-shadow:0 16px 45px rgba(31,65,105,.12);
}

.chips{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.chip{
  background:var(--sky);
  border:1px solid #cfe6fb;
  border-radius:999px;
  padding:7px 12px;
  font-size:14px;
  font-weight:700;
}

.card{
  border:1px solid var(--line);
  border-radius:18px;
  padding:20px;
  margin:18px 0;
  background:#fff;
}

.card h2{
  margin:0 0 8px;
  font-size:23px;
}

.route{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}

.stop{
  background:#f8fbff;
  border-radius:16px;
  padding:18px;
  border:1px solid var(--line);
}

.num{
  display:inline-grid;
  place-items:center;
  width:30px;
  height:30px;
  border-radius:50%;
  background:var(--ink);
  color:#fff;
  font-weight:900;
}

.note{
  background:#fff9e9;
  border:1px solid #f4df9e;
  border-radius:16px;
  padding:16px;
}

.food{
  background:#f7fbff;
  border:1px solid #cfe6fb;
}

.cta{
  display:block;
  text-align:center;
  text-decoration:none;
  background:var(--ink);
  color:#fff;
  padding:15px;
  border-radius:14px;
  font-weight:900;
  margin:12px 0;
}

.cta.secondary{
  background:#fff;
  color:var(--ink);
  border:1px solid var(--ink);
}

.ad{
  border:1px dashed #a9b9c9;
  color:#7b8b9c;
  border-radius:14px;
  padding:24px;
  text-align:center;
  margin:28px 0;
  background:#fafcff;
}

.footer{
  margin-top:44px;
  padding:30px 0 50px;
  border-top:1px solid var(--line);
  color:var(--muted);
  font-size:14px;
}

@media(max-width:680px){
  .route{
    grid-template-columns:1fr;
  }

  .hero{
    padding-top:24px;
  }

  .hero h1{
    letter-spacing:-1px;
  }

  .lead{
    font-size:16px;
  }
